<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown: #623413;
      --cream: #f5f5dc;
      --white: #ffffff;
    }

    
    body {
      background-color: var(--cream);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: var(--white);
    }

    .logo img {
      height: 50px;
      width: 50px;
      object-fit: cover;
      border-radius: 50%;
    }

    .links a {
      margin-left: 20px;
      text-decoration: none;
      color: black;
    }

    .wrapper {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .contact-section {
      padding: 50px 0 60px 0;
      background-color: var(--cream);
    }

    .contact-section h2 {
      margin-bottom: 20px;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 18px;
    }

    .contact-item:last-child {
      margin-bottom: 0;
    }

    .contact-item p {
      margin: 0;
      color: #333;
      line-height: 1.6;
    }

    .contact-link {
      color: #6f3511;
      text-decoration: none;
    }

    .contact-link:hover {
      text-decoration: underline;
    }

    .contact-icon {
      width: 20px;
      height: 20px;
      color: var(--brown);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="coffee-bar.jpg" alt="Die Kaffeebar logo">
    </div>
<div class="links">
  <a href="getting started (2).html">Home</a>
  <a href="menu.html">Menu</a>
  <a href="visit-us.html">Visit Us</a>
</div>
  </nav>

  <section class="contact-section">
    <div class="wrapper">
      <h2>Contact Info</h2>
      <div class="contact-item">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        <p><a href="tel:+491794834719" class="contact-link">0179 4834719</a></p>
      </div>
      <div class="contact-item">
        <svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <p><a href="mailto:die-kaffeebar@web.de" class="contact-link">die-kaffeebar@web.de</a></p>
      </div>
    </div>
  </section>

</body>
</html>
