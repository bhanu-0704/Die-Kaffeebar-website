<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown: #623413;
      --cream: #f5f5dc;
      --white: #ffffff;
    }

    body {
      background-color: var(--cream);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: var(--white);
    }

    .logo img {
      height: 50px;
      width: 50px;
      object-fit: cover;
      border-radius: 50%;
    }

    .links a {
      margin-left: 20px;
      text-decoration: none;
      color: black;
    }

    .wrapper {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .location-section {
      padding: 40px 0;
      background-color: var(--white);
    }

    .location-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .contact-section {
      padding: 30px 0 50px 0;
      background-color: var(--cream);
    }

    .contact-section h2 {
      margin-bottom: 20px;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 18px;
    }

    .contact-item:last-child {
      margin-bottom: 0;
    }

    .contact-item p {
      margin: 0;
      color: #333;
      line-height: 1.6;
    }

    .contact-link {
      color: #6f3511;
      text-decoration: none;
    }

    .contact-link:hover {
      text-decoration: underline;
    }

    .icon {
      width: 28px;
      height: 28px;
      color: var(--brown);
      flex-shrink: 0;
    }

    .contact-icon {
      width: 20px;
      height: 20px;
      color: var(--brown);
      flex-shrink: 0;
    }

    .social-links {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      margin-left: 45px;
    }

    .facebook-link,
    .instagram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .facebook-icon,
    .instagram-icon {
      width: 18px;
      height: 18px;
      display: block;
    }

    .address-link {
      color: #6f3511;
      text-decoration: none;
    }

    .address-link:hover {
      color: #6f3511;
      text-decoration: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
