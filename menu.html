<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    :root {
      --brown: #623413;
      --cream: #f5f5dc;
      --white: #ffffff;
    }
    body {
      background-color: var(--cream);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: var(--white);
    }
    .logo img {
      height: 50px;
      width: 50px;
      object-fit: cover;
      border-radius: 50%;
    }
    .links a {
      margin-left: 20px;
      text-decoration: none;
      color: black;
    }
    .menu-section {
      padding: 60px 0;
    }
    .wrapper {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
      font-size: 1.1em;
    }
    .item-info {
      display: flex;
      flex-direction: column;
    }
    .item-name {
      font-weight: 600;
      color: var(--brown);
    }
    .item-price {
      color: #555;
      font-size: 0.9em;
      margin-top: 4px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background-color: var(--brown);
      color: var(--white);
      font-size: 1.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background-color 0.2s ease;
    }
    .qty-btn:hover {
      background-color: #4a2710;
    }
    .qty-count {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
      color: var(--brown);
    }
    .table-select {
      margin-top: 30px;
    }
    .table-select label {
      display: block;
      font-weight: 600;
      color: var(--brown);
      margin-bottom: 8px;
    }
    .table-select select {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: 'Poppins', sans-serif;
    }
    .order-summary {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid var(--brown);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2em;
      font-weight: 700;
      color: var(--brown);
    }
    .order-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px 0;
      background-color: var(--brown);
      color: var(--white);
      text-align: center;
      font-size: 1.1em;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .order-btn:hover {
      background-color: #4a2710;
    }
    .order-btn:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 0.95em;
      color: var(--brown);
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="coffee-bar.jpg" alt="Die Kaffeebar logo">
    </div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="visit-us.html">Visit Us</a>
      <a href="contact-us.html">Contact Us</a>
    </div>
  </nav>

  <section class="menu-section">
    <div class="wrapper">
      <h2>Our Menu</h2>

      <div class="menu-item" data-name="Cappuccino" data-price="3.50">
        <div class="item-info">
          <span class="item-name">Cappuccino</span>
          <span class="item-price">€3.50</span>
        </div>
        <div class="qty-controls">
          <span class="qty-count">0</span>
          <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
        </div>
      </div>

      <div class="menu-item" data-name="Espresso" data-price="2.20">
        <div class="item-info">
          <span class="item-name">Espresso</span>
          <span class="item-price">€2.20</span>
        </div>
        <div class="qty-controls">
          <span class="qty-count">0</span>
          <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
        </div>
      </div>

      <div class="menu-item" data-name="Flat White" data-price="2.80">
        <div class="item-info">
          <span class="item-name">Flat White</span>
          <span class="item-price">€2.80</span>
        </div>
        <div class="qty-controls">
          <span class="qty-count">0</span>
          <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
        </div>
      </div>

      <div class="table-select">
        <label for="table-number">Table Number</label>
        <select id="table-number">
          <option value="">Select your table</option>
          <option value="1">Table 1</option>
          <option value="2">Table 2</option>
          <option value="3">Table 3</option>
          <option value="4">Table 4</option>
          <option value="5">Table 5</option>
          <option value="6">Table 6</option>
          <option value="7">Table 7</option>
          <option value="8">Table 8</option>
          <option value="9">Table 9</option>
          <option value="10">Table 10</option>
        </select>
      </div>

      <div class="order-summary">
        <span>Total:</span>
        <span id="total-price">€0.00</span>
      </div>

      <button class="order-btn" id="order-btn" onclick="submitOrder()" disabled>Order</button>
      <div class="status-msg" id="status-msg"></div>
    </div>
  </section>

  <script>
    // Initialize EmailJS with your Public Key
    emailjs.init("E_6aqWSN9LFzMv6c1");

    function changeQty(button, delta) {
      const menuItem = button.closest('.menu-item');
      const qtySpan = menuItem.querySelector('.qty-count');
      let qty = parseInt(qtySpan.textContent);
      qty = Math.max(0, qty + delta);
      qtySpan.textContent = qty;
      updateTotal();
    }

    function updateTotal() {
      const items = document.querySelectorAll('.menu-item');
      let total = 0;
      items.forEach(item => {
        const price = parseFloat(item.dataset.price);
        const qty = parseInt(item.querySelector('.qty-count').textContent);
        total += price * qty;
      });
      document.getElementById('total-price').textContent = '€' + total.toFixed(2);

      const orderBtn = document.getElementById('order-btn');
      orderBtn.disabled = total === 0;
    }

    function submitOrder() {
      const tableNumber = document.getElementById('table-number').value;
      if (!tableNumber) {
        document.getElementById('status-msg').textContent = 'Please select a table number first.';
        return;
      }

      const items = document.querySelectorAll('.menu-item');
      let orderDetails = '';
      let total = 0;
      items.forEach(item => {
        const qty = parseInt(item.querySelector('.qty-count').textContent);
        if (qty > 0) {
          const name = item.dataset.name;
          const price = parseFloat(item.dataset.price);
          orderDetails += `${name} x${qty} (€${(price * qty).toFixed(2)})\n`;
          total += price * qty;
        }
      });

      document.getElementById('status-msg').textContent = 'Sending order...';

      emailjs.send('service_fmzjx77', 'template_ox63u36', {
        table_number: tableNumber,
        order_details: orderDetails,
        total_price: '€' + total.toFixed(2)
      }).then(function() {
        document.getElementById('status-msg').textContent = 'Order sent! Redirecting to payment...';
        setTimeout(() => {
          const paypalUsername = 'diekaffeebar';
          window.location.href = `https://www.paypal.com/paypalme/${paypalUsername}/${total.toFixed(2)}EUR`;
        }, 1500);
      }, function(error) {
        document.getElementById('status-msg').textContent = 'Something went wrong sending the order. Please try again.';
        console.error(error);
      });
    }
  </script>

</body>
</html>
