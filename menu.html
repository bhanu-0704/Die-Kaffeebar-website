<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=AclwA-p_6LX08IBTGTOu7L2dVxyoCZyk57nGFTH7VnRWM-Z3BnZiV4oc1Ch8iIDuMQ6nN28lLRMWZDDO&currency=EUR"></script>
  <style>
    :root {
      --brown: #623413;
      --cream: #f5f5dc;
      --white: #ffffff;
    }
    body {
      background-color: var(--cream);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: var(--white);
    }
    .logo img {
      height: 50px;
      width: 50px;
      object-fit: cover;
      border-radius: 50%;
    }
    .links a {
      margin-left: 20px;
      text-decoration: none;
      color: black;
    }
    .menu-section {
      padding: 60px 0;
    }
    .wrapper {
      max-width: 700px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
      font-size: 1.1em;
    }
    .item-info {
      display: flex;
      flex-direction: column;
    }
    .item-name {
      font-weight: 600;
      color: var(--brown);
    }
    .item-price {
      color: #555;
      font-size: 0.9em;
      margin-top: 4px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background-color: var(--brown);
      color: var(--white);
      font-size: 1.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background-color 0.2s ease;
    }
    .qty-btn:hover {
      background-color: #4a2710;
    }
    .qty-count {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
      color: var(--brown);
    }
    .table-select {
      margin-top: 30px;
    }
    .table-select label {
      display: block;
      font-weight: 600;
      color: var(--brown);
      margin-bottom: 8px;
    }
    .table-select select {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: 'Poppins', sans-serif;
    }
    .order-summary {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid var(--brown);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2em;
      font-weight: 700;
      color: var(--brown);
    }
    #paypal-button-container {
      margin-top: 20px;
    }
    .status-msg {
      margin-top: 12px;
      text-align: center;
      font-size: 0.95em;
      color: var(--brown);
    }
    .select-table-warning {
      margin-top: 12px;
      text-align: center;
      font-size: 0.95em;
      color: #b03a2e;
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="coffee-bar.jpg" alt="Die Kaffeebar logo">
    </div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="visit-us.html">Visit Us</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <section class="menu-section">
    <div class="wrapper">
      <h2>Our Menu</h2>

      <div class="menu-item" data-name="Cappuccino" data-price="3.50">
        <div class="item-info">
          <span class="item-name">Cappuccino</span>
          <span class="item-price">€3.50</span>
        </div>
        <div class="qty-controls">
          <span class="qty-count">0</span>
          <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
        </div>
      </div>

      <div class="menu-item" data-name="Espresso" data-price="2.20">
        <div class="item-info">
          <span class="item-name">Espresso</span>
          <span class="item-price">€2.20</span>
        </div>
        <div class="qty-controls">
          <span class="qty-count">0</span>
          <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
        </div>
      </div>

      <div class="menu-item" data-name="Flat White" data-price="2.80">
        <div class="item-info">
          <span class="item-name">Flat White</span>
          <span class="item-price">€2.80</span>
        </div>
        <div class="qty-controls">
          <span class="qty-count">0</span>
          <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
        </div>
      </div>

      <div class="table-select">
        <label for="table-number">Table Number</label>
        <select id="table-number">
          <option value="">Select your table</option>
          <option value="1">Table 1</option>
          <option value="2">Table 2</option>
          <option value="3">Table 3</option>
          <option value="4">Table 4</option>
          <option value="5">Table 5</option>
          <option value="6">Table 6</option>
          <option value="7">Table 7</option>
          <option value="8">Table 8</option>
          <option value="9">Table 9</option>
          <option value="10">Table 10</option>
        </select>
      </div>

      <div class="order-summary">
        <span>Total:</span>
        <span id="total-price">€0.00</span>
      </div>

      <div id="paypal-button-container"></div>
      <div class="select-table-warning" id="table-warning">Please select a table number before paying.</div>
      <div class="status-msg" id="status-msg"></div>
    </div>
  </section>

  <script>
    emailjs.init("E_6aqWSN9LFzMv6c1");

    function changeQty(button, delta) {
      const menuItem = button.closest('.menu-item');
      const qtySpan = menuItem.querySelector('.qty-count');
      let qty = parseInt(qtySpan.textContent);
      qty = Math.max(0, qty + delta);
      qtySpan.textContent = qty;
      updateTotal();
    }

    function getOrderDetails() {
      const items = document.querySelectorAll('.menu-item');
      let orderDetails = '';
      let total = 0;
      items.forEach(item => {
        const qty = parseInt(item.querySelector('.qty-count').textContent);
        if (qty > 0) {
          const name = item.dataset.name;
          const price = parseFloat(item.dataset.price);
          orderDetails += `${name} x${qty} (€${(price * qty).toFixed(2)})\n`;
          total += price * qty;
        }
      });
      return { orderDetails, total };
    }

    function updateTotal() {
      const { total } = getOrderDetails();
      document.getElementById('total-price').textContent = '€' + total.toFixed(2);
    }

    // Render the PayPal button once the page loads
    paypal.Buttons({
      createOrder: function(data, actions) {
        const { total } = getOrderDetails();
        const tableNumber = document.getElementById('table-number').value;

        if (!tableNumber) {
          document.getElementById('table-warning').style.display = 'block';
          return actions.reject();
        }
        document.getElementById('table-warning').style.display = 'none';

        if (total === 0) {
          document.getElementById('status-msg').textContent = 'Please add at least one item first.';
          return actions.reject();
        }

        return actions.order.create({
          purchase_units: [{
            amount: {
              value: total.toFixed(2),
              currency_code: 'EUR'
            }
          }]
        });
      },

      onApprove: function(data, actions) {
        // This only runs AFTER PayPal confirms the payment succeeded
        return actions.order.capture().then(function(details) {
          const { orderDetails, total } = getOrderDetails();
          const tableNumber = document.getElementById('table-number').value;

          document.getElementById('status-msg').textContent = 'Payment successful! Sending order to the café...';

          emailjs.send('service_fmzjx77', 'template_ox63u36', {
            table_number: tableNumber,
            order_details: orderDetails,
            total_price: '€' + total.toFixed(2)
          }).then(function() {
            document.getElementById('status-msg').textContent = 'Payment confirmed and order sent! Thank you.';
          }, function(error) {
            document.getElementById('status-msg').textContent = 'Payment succeeded, but the order email failed to send. Please tell staff your table number.';
            console.error(error);
          });
        });
      },

      onError: function(err) {
        document.getElementById('status-msg').textContent = 'Something went wrong with the payment. Please try again.';
        console.error(err);
      }

    }).render('#paypal-button-container');
  </script>

</body>
</html>
