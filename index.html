<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
 
  <style>
    :root {
  --brown: #623413;
  --cream: #f5f5dc;
  --white: #ffffff;
}

body {
  background-color: var(--cream);
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background-color: var(--white);
}

.logo img {
  height: 50px;
  width: 50px;
  object-fit: cover;
  border-radius: 50%;
}

.links a {
  margin-left: 20px;
  text-decoration: none;
  color: black;
}

.hero {
  display: flex;
  align-items: center;
  background-color: var(--brown);
  color: white;
  padding: 60px 40px;
  gap: 40px;
}

.hero-text {
  flex: 1.3;
}

.hero-image {
  flex: 1;
}


.hero-inner {
  display: flex;
  align-items: center;
  gap: 40px;
}

.hero-image img {
  width: 80%;
  height: 320px;
  object-fit: cover;
  object-position: center 40%;
  border-radius: 14px;
  display: block;

}

.shop-title {
  font-size: 3.4em;
  font-weight: 700;
  line-height: 1.1;
  margin: 0 0 8px 0;
}

.btn {
  display: inline-block;
  margin-top: 24px;
  padding: 12px 28px;
  background-color: var(--cream);
  color: var(--brown);
  text-decoration: none;
  font-weight: 600;
  border-radius: 4px;
  transition: background-color 0.2s ease;
}

.btn:hover {
  background-color: var(--white);
}

.menu-section {
  padding: 60px 0;
}

.wrapper {
  max-width: 700px;
  margin: 0 auto;
  padding: 0 20px;
}
.location-section {
  padding: 40px 0;
  background-color: var(--white);
}
.about-section {
  padding: 50px 0;
  background-color: var(--white);
  text-align: center;
}

.about-section p {
  font-size: 1.2em;
  color: #333;
  line-height: 1.7;
  max-width: 600px;
  margin: 0 auto;
}

.location-item {
  display: flex;
  align-items: flex-start;
  gap: 16px;
}

.contact-section {
  padding: 30px 0 50px 0;
  background-color: var(--cream);
}

.contact-section h2 {
  margin-bottom: 20px;
}

.contact-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 18px;
}

.contact-item:last-child {
  margin-bottom: 0;
}

.contact-item p {
  margin: 0;
  color: #333;
  line-height: 1.6;
}

.contact-link {
  color: #6f3511;
  text-decoration: none;
}

.contact-link:hover {
  text-decoration: underline;
}

.icon {
  width: 28px;
  height: 28px;
  color: var(--brown);
  flex-shrink: 0;
}

.contact-icon {
  width: 20px;
  height: 20px;
  color: var(--brown);
  flex-shrink: 0;
}
.espresso-figure {
  margin: 30px auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
}

.espresso-img {
  width: 280px;
  height: 280px;
  object-fit: cover;
  border-radius: 14px;
  display: block;
}

.espresso-figure figcaption {
  font-style: italic;
  color: var(--brown);
  font-weight: 600;
  font-size: 1.4em;
  max-width: 250px;
}
.social-links {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 15px;
  margin-left: 45px; /* lines up under the address text, not the pin icon */
}

.facebook-link,
.instagram-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  margin: 0; /* let the parent's `gap` handle spacing */
  padding: 0;
  line-height: 0; /* kills the phantom box around the instagram icon */
}

.facebook-icon,
.instagram-icon {
  width: 18px;
  height: 18px;
  display: block;
}
.address-link {
    color: #6f3511;
    text-decoration: none;
}

.address-link:hover {
    color: #6f3511;
    text-decoration: none;
}
.menu-item {
  display: flex;
  justify-content: space-between;
  padding: 16px 0;
  border-bottom: 1px solid #ddd;
  font-size: 1.1em;
}

.item-name {
  font-weight: 600;
  color: var(--brown);
}

.item-price {
  color: #555;
}

table {
  width: 100%;
  border-collapse: collapse;
}

td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: center;
} 
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <img src="coffee-bar.jpg" alt="Die Kaffeebar logo">
    </div>
<div class="links">
  <a href="menu.html">Menu</a>
  <a href="visit-us.html">Visit Us</a>
  <a href="contact-us.html">Contact Us</a>
</div>
  </nav>

 
   <header class="hero">
  <div class="hero-text">
    <h1 class="shop-title">Die Kaffeebar</h1>
    <p>Good Coffee, right on Campus</p>
  </div>
  
  <div class="hero-image">
    <img src="hero-coffee.png" alt="Freshly made coffee">
  </div>
</div>
</header>

<section class="about-section">
  <div class="wrapper">
    <h2>Über uns</h2>
    <p>Die Kaffeebar bietet seinen Gästen in gemütlicher Atmosphäre feinsten italienischen Kaffeegenuss.</p>
  <figure class="espresso-figure">
      <img src="espresso.jpg" alt="Frisch zubereiteter Espresso" class="espresso-img">
      <figcaption>Einfach kaffeeschön!!</figcaption>
    </figure>
  
  </div>
</section>
  

 
</header>

</body>
</html>
